<script>
'use strict';
(function(){
/* ========== Constantes ========== */
var KEY='lifeos.data.v1',SAV='Épargne';
var PR={low:'Faible',med:'Moyen',high:'Élevé',urgent:'Urgent'},PRW={low:1,med:2,high:3,urgent:4};
var ST={todo:'À faire',doing:'En cours',done:'Terminée',postponed:'Reportée'};
var PAGES=[['dashboard','Tableau de bord','home'],['tasks','Mes tâches','tasks'],['planning','Planning','clock'],['calendar','Calendrier','calendar'],['goals','Mes objectifs','target'],['habits','Habitudes','repeat'],['finance','Budget et finances','wallet'],['focus','Concentration','timer'],['stats','Statistiques','chart'],['review','Bilan quotidien','book'],['settings','Paramètres','settings']];
var PAY=['Espèces','Mvola','Orange Money','Airtel Money','Carte bancaire','Virement','Autre'];
var PAL=['#7c5cff','#2ee59d','#4f8cff','#ffb84d','#ff6fae','#38d6e0','#ff8a5c','#b388ff','#9be564','#8b93b8'];
var QUOTES=['Un petit pas chaque jour vaut mieux qu’un grand bond une fois par mois.','La régularité bat l’intensité : reviens demain, même un peu.','Ta journée commence par une décision : avancer.','Fais d’abord la chose qui compte, le reste suivra.','Tu n’as pas besoin d’être parfait, seulement de continuer.','Chaque tâche terminée est une promesse tenue envers toi-même.','Une journée difficile ne définit pas ta semaine.','Commence petit, commence maintenant.','La discipline, c’est choisir ce que tu veux le plus plutôt que ce que tu veux maintenant.','Ton futur te remerciera pour ce que tu fais aujourd’hui.','Un plan simple appliqué vaut mieux qu’un plan parfait ignoré.','Progresser, c’est déjà gagner.','Prends soin de ton énergie : elle est ton premier capital.','Une session de concentration à la fois.','Ce que tu répètes devient ce que tu es.','Aujourd’hui est une page blanche : écris-y quelque chose dont tu seras fier.','Les grands projets se construisent à coups de petites heures.','Reposer, c’est aussi avancer.','Ne compare pas ton chapitre 1 au chapitre 20 des autres.','La motivation te lance, l’habitude te porte.','Sois patient : les racines poussent avant les feuilles.','Un budget, c’est de la liberté organisée.','Fais le premier pas, la route apparaîtra.','Tu as déjà surmonté des journées plus dures que celle-ci.','Choisis une priorité, donne-lui ton meilleur.','L’effort d’aujourd’hui est le confort de demain.','Apprendre un peu chaque jour change une vie en un an.','Respire, organise, avance.','Rien de grand ne se fait sans constance.','Une journée manquée n’efface pas tes progrès : reprends simplement.','Termine ce que tu as commencé, puis célèbre.'];
var DOW=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

/* ========== Utilitaires ========== */
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var pd=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var today=function(){return ymd(new Date())};
var addDays=function(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
var diffD=function(a,b){return Math.round((pd(b)-pd(a))/864e5)};
var tm=function(t){if(!t)return null;var a=t.split(':').map(Number);return a[0]*60+a[1]};
var validDate=function(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(pd(s))===s&&+s.slice(0,4)>=2000&&+s.slice(0,4)<=2100};
var validTime=function(s){return s===''||/^([01]\d|2[0-3]):[0-5]\d$/.test(s)};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var fdate=function(s,o){return pd(s).toLocaleDateString('fr-FR',o||{weekday:'long',day:'numeric',month:'long'})};
var fshort=function(s){return pd(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})};
var mname=function(ym){var a=ym.split('-');return cap(new Date(+a[0],+a[1]-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}))};
var mshort=function(ym){var a=ym.split('-');return new Date(+a[0],+a[1]-1,1).toLocaleDateString('fr-FR',{month:'short'}).replace('.','')};
var addMonths=function(ym,n){var a=ym.split('-').map(Number),d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var sym=function(){return({MGA:'Ar',EUR:'€',USD:'$'})[S.settings.currency]||'Ar'};
var fm=function(n){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(Math.round((n||0)*100)/100)+' '+sym()};
var shortN=function(n){var a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1).replace('.0','')+' M':a>=1e3?Math.round(n/1e3)+' k':String(Math.round(n))};
var fdur=function(m){m=Math.round(m||0);return m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60)};
var num=function(s){if(s==null)return NaN;s=String(s).replace(/\s/g,'').replace(',','.');return s===''?NaN:Number(s)};
var rnd=function(x){return Math.round(x*100)/100};
var sum=function(a){return rnd(a.reduce(function(s,t){return s+t.amt},0))};
var ic=function(n,c){return '<svg class="ic '+(c||'')+'" aria-hidden="true" focusable="false"><use href="#i-'+n+'"/></svg>'};
var opt=function(arr,v){return arr.map(function(x){var a=Array.isArray(x)?x:[x,x];return '<option value="'+esc(a[0])+'"'+(String(a[0])===String(v)?' selected':'')+'>'+esc(a[1])+'</option>'}).join('')};

/* ========== Données ========== */
function D(){
  var cats=[['Études','#7c5cff'],['Travail','#4f8cff'],['Programmation','#2ee59d'],['Sport','#ff8a5c'],['Santé et bien-être','#ff6fae'],['Famille','#ffd166'],['Finances','#38d6e0'],['Projets personnels','#b388ff'],['Loisirs','#9be564'],['Autres','#8b93b8']].map(function(x){return{n:x[0],c:x[1]}});
  return{v:1,
  settings:{name:'',avatar:'',currency:'MGA',dayStart:'05:00',dayEnd:'23:00',theme:'dark',taskView:'cards',weekMon:true,welcomed:false,cats:cats,
    incCats:['Salaire','Stage / Freelance','Revenus commerciaux','Autres revenus'],
    expCats:['Nourriture','Transport','Internet et téléphone','Études','Logement','Santé','Sport','Loisirs',SAV,'Autres dépenses'],
    pomo:{focus:25,short:5,long:15,every:4}},
  tasks:[],events:[],routines:[],
  goals:{daily:['Lire pendant 20 minutes','Faire du sport','Apprendre quelque chose','Terminer une tâche importante','Respecter mon planning'].map(function(t){return{id:uid(),title:t}}),
    weekly:[{id:uid(),title:'Heures d’étude',target:10,unit:'h',mode:'hours',cat:'Études'},{id:uid(),title:'Séances de sport',target:3,unit:'séances',mode:'count',cat:'Sport'},{id:uid(),title:'Tâches importantes terminées',target:5,unit:'tâches',mode:'important',cat:''},{id:uid(),title:'Temps pour mes projets personnels',target:4,unit:'h',mode:'hours',cat:'Projets personnels'}],
    long:[]},
  goalLog:{},weeklyLog:{},history:[],achievements:{},
  habits:[['Se réveiller à l’heure','daily',7],['Lire','daily',7],['Faire du sport','weekly',3],['Boire suffisamment d’eau','daily',7],['Étudier ou coder','daily',7],['Réduire le temps passé sur le téléphone','daily',7],['Dormir à une heure raisonnable','daily',7]].map(function(h){return{id:uid(),name:h[0],freq:h[1],target:h[2],created:today()}}),
  habitLog:{},tx:[],budget:{total:0,limits:{},saveGoal:0,opening:0},pomo:{sessions:[],run:null},days:{}};
}
var S=null,storageOK=true;
function merge(d,s){for(var k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))Object.assign(d[k],s[k]);else d[k]=s[k]}return d}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){try{S=merge(D(),JSON.parse(r))}catch(e){try{localStorage.setItem(KEY+'.corrompu',r)}catch(x){}S=D();setTimeout(function(){toast('Les données enregistrées étaient illisibles : une copie de sauvegarde a été conservée.','err')},300)}}else S=D()}
  catch(e){storageOK=false;S=D();setTimeout(function(){toast('Le stockage local est indisponible (navigation privée ?). Les données ne seront pas conservées.','err')},300)}
  var s=S.settings;if(!s.pomo)s.pomo={focus:25,short:5,long:15,every:4};
}
function save(){if(!storageOK)return false;try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Stockage local saturé : exportez vos données (Paramètres) puis libérez de l’espace.','err');return false}}
function commit(){checkBadges();save();render()}

/* ========== Sélecteurs de données ========== */
var catColor=function(n){var c=S.settings.cats.find(function(x){return x.n===n});return c?c.c:'#8b93b8'};
var tasksOn=function(d){return S.tasks.filter(function(t){return t.date===d})};
var dayOf=function(d){return S.days[d]||(S.days[d]={})};
var cmpTime=function(a,b){return(a.date+(a.start||'99:99')).localeCompare(b.date+(b.start||'99:99'))};
function tdur(t){if(t.dur>0)return t.dur;if(t.start&&t.end)return tm(t.end)-tm(t.start);return 0}
function wstart(d){var x=pd(d),o=S.settings.weekMon?(x.getDay()+6)%7:x.getDay();x.setDate(x.getDate()-o);return ymd(x)}
function prodSet(){var s={};S.tasks.forEach(function(t){if(t.st==='done'&&t.done)s[t.done]=1});return s}
function prodStreak(){var s=prodSet(),d=today();if(!s[d])d=addDays(d,-1);var n=0;while(s[d]&&n<4000){n++;d=addDays(d,-1)}return n}
function bestStreak(){var a=Object.keys(prodSet()).sort(),b=0,c=0,p=null;a.forEach(function(d){c=(p&&addDays(p,1)===d)?c+1:1;if(c>b)b=c;p=d});return b}
var hDone=function(id,d){return!!(S.habitLog[id]&&S.habitLog[id][d])};
function hCount(id,a,b){var n=0,d=a;while(d<=b){if(hDone(id,d))n++;d=addDays(d,1)}return n}
function hStreak(h){
  if(h.freq==='weekly'){var tg=h.target||1,w=wstart(today()),n=0;if(hCount(h.id,w,addDays(w,6))>=tg)n++;w=addDays(w,-7);while(n<520&&hCount(h.id,w,addDays(w,6))>=tg){n++;w=addDays(w,-7)}return n}
  var d=today();if(!hDone(h.id,d))d=addDays(d,-1);var k=0;while(k<4000&&hDone(h.id,d)){k++;d=addDays(d,-1)}return k}
function hRate(h){var t=today(),from=addDays(t,-29);if(h.created&&h.created>from)from=h.created;var days=diffD(from,t)+1;if(days<1)days=1;var done=hCount(h.id,from,t),exp=h.freq==='weekly'?Math.max(1,Math.round((h.target||1)*days/7)):days;return Math.min(100,Math.round(done/exp*100))}
var isSav=function(t){return t.type==='dep'&&t.cat===SAV},isExp=function(t){return t.type==='dep'&&t.cat!==SAV},isInc=function(t){return t.type==='rev'};
function finMonth(m){var L=S.tx.filter(function(t){return t.date.indexOf(m)===0});return{inc:sum(L.filter(isInc)),exp:sum(L.filter(isExp)),sav:sum(L.filter(isSav))}}
function balance(){return rnd((S.budget.opening||0)+sum(S.tx.filter(isInc))-sum(S.tx.filter(isExp))-sum(S.tx.filter(isSav)))}
function catSpend(m){var o={};S.tx.filter(function(t){return isExp(t)&&t.date.indexOf(m)===0}).forEach(function(t){o[t.cat]=rnd((o[t.cat]||0)+t.amt)});return o}
function budgetAlerts(m){
  var a=[],f=finMonth(m),b=S.budget;
  if(b.total>0){var p=f.exp/b.total*100;if(p>=100)a.push({l:'bad',t:'Budget mensuel dépassé : '+fm(f.exp)+' dépensés sur '+fm(b.total)+'.'});else if(p>=80)a.push({l:'warn',t:'Attention : '+Math.round(p)+' % du budget mensuel est déjà utilisé.'})}
  var cs=catSpend(m);Object.keys(b.limits||{}).forEach(function(c){var lim=b.limits[c];if(!(lim>0))return;var p=(cs[c]||0)/lim*100;if(p>=100)a.push({l:'bad',t:'Limite dépassée pour « '+c+' » ('+fm(cs[c]||0)+' / '+fm(lim)+').'});else if(p>=80)a.push({l:'warn',t:'« '+c+' » : '+Math.round(p)+' % de la limite utilisée.'})});
  return a}
function wVal(g,ws){var we=addDays(ws,6),L=S.tasks.filter(function(t){return t.st==='done'&&t.done>=ws&&t.done<=we});
  if(g.mode==='important')return L.filter(function(t){return t.prio==='high'||t.prio==='urgent'}).length;
  if(g.mode==='hours')return Math.round(L.filter(function(t){return t.cat===g.cat}).reduce(function(s,t){return s+tdur(t)},0)/6)/10;
  if(g.mode==='count')return L.filter(function(t){return t.cat===g.cat}).length;
  return S.weeklyLog[g.id+'|'+ws]||0}
var gProg=function(g){if(g.status==='done')return 100;if(g.steps&&g.steps.length)return Math.round(g.steps.filter(function(s){return s.d}).length/g.steps.length*100);return g.p||0};
var gLate=function(g){return g.status!=='done'&&g.deadline&&g.deadline<today()};
function nextItem(){var now=new Date(),t=ymd(now),m=now.getHours()*60+now.getMinutes(),c=[];
  S.tasks.forEach(function(x){if(x.st==='done')return;if(x.date>t||(x.date===t&&(!x.start||tm(x.start)>=m)))c.push({k:'Tâche',title:x.title,date:x.date,start:x.start})});

function beep(){try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(function(){o.stop();c.close()},450)}catch(e){}}

  var r=ensureRun();
  if(over>30*60*1000){toast('Le minuteur est arrivé à son terme pendant votre absence : la session n’est pas comptée.','warn')}
  else{if(r.mode==='focus'){S.pomo.sessions.push({id:uid(),date:today(),min:Math.round(r.total/60),task:r.task||'',at:Date.now()});notify('Session terminée !','Prenez une vraie pause, vous l’avez méritée.')}else notify('Pause terminée','Prêt pour une nouvelle session ?')}
  var n=S.pomo.sessions.filter(function(s){return s.date===today()}).length,next=r.mode==='focus'?((n>0&&n%(S.settings.pomo.every||4)===0)?'long':'short'):'focus',t=S.settings.pomo[next]*60;
  S.pomo.run={mode:next,total:t,left:t,running:false,endAt:0,task:r.task||''};checkBadges();save();render()}
